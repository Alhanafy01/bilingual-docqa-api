name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check .
            - name: Format Check
              run: uv run ruff format --check .
            - name: Type Check
              run: uv run mypy src tests
            - name: Test
              run: uv run pytest
