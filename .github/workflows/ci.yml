name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:

    checks:
        runs-on: ubuntu-latest
        services:
            db:
                image: pgvector/pgvector:0.8.6-pg17
                env:
                    POSTGRES_USER: docqa
                    POSTGRES_PASSWORD: docqa
                    POSTGRES_DB: docqa_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql+asyncpg://docqa:docqa@localhost:5432/docqa_test
            TEST_DATABASE_URL: postgresql+asyncpg://docqa:docqa@localhost:5432/docqa_test
        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked

            - name: Lint
              run: uv run ruff check .

            - name: Format check
              run: uv run ruff format --check .

            - name: Type check
              run: uv run mypy src tests

            - name: Run migrations
              run: uv run alembic upgrade head

            - name: Test
              run: uv run pytest
